#
# The JVM sidecars' Maven dependency versions; each subproject reads these
# (`val arrowVersion: String by project`). Not covered: parquet-arrow-core, which
# the composite build substitutes from the parquet-arrow-java submodule (its commit
# is the pin), and clients/java, which pins its own (see its build.gradle.kts).
#
# hardwoodVersion is the parquet@hardwood lanes' Hardwood (dev.hardwood:hardwood-core,
# and the hardwood-bom that pins its optional codec libraries). 1.0 only reads;
# writing arrived in 1.1.0.Beta1, the newest release, so both lanes use it. Hardwood
# targets Java 21, so that subproject alone builds on a Java 21 toolchain. A new
# release changes what the lane writes and reads: re-measure it in compliance.
#
# vortexJniVersion is held in lockstep with vortex-data (pyproject.toml) and the
# vortex crate (sidecars/rust/Cargo.toml, clients/rust/Cargo.toml).
# arrowVersion must equal the Arrow Java that vortex-jni is built against: its API
# hands back arrow-java readers and vectors, so any other version would put two
# Arrows on one classpath. Check it when bumping vortexJniVersion.
arrowVersion=19.0.0
vortexJniVersion=0.86.1
junitVersion=5.10.2
slf4jVersion=2.0.18
jacksonVersion=2.21.0
hardwoodVersion=1.1.0.Beta1
# The avro@java lanes' zstandard codec: Avro declares zstd-jni optional, so the version
# is Avro's own pin (avro-parent 1.12.1, the Avro that arrow-avro $arrowVersion brings).
zstdJniVersion=1.5.7-4

# Where Gradle looks for JDKs before provisioning one: the variables actions/setup-java
# exports on CI (unset elsewhere, which Gradle ignores), so a CI job that installs 17 and
# 21 does not also download a Java 21 for parquet-hardwood.
org.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64
